 <script>
  // Intro Slideshow
  let introSlideIndex = 0;
  
  function showIntroSlides(n) {
    let slides = document.querySelectorAll('.intro-slideshow .slide');
    let dots = document.querySelectorAll('.intro-dots .dot');
    
    if (n >= slides.length) { introSlideIndex = 0 }
    if (n < 0) { introSlideIndex = slides.length - 1 }
    
    slides.forEach((slide) => slide.style.display = "none");
    dots.forEach((dot) => dot.className = dot.className.replace(" active", ""));
    
    slides[introSlideIndex].style.display = "block";
    dots[introSlideIndex].className += " active";
  }
  
  function currentIntroSlide(n) {
    introSlideIndex = n;
    showIntroSlides(introSlideIndex);
  }
  
  function autoIntroSlides() {
    introSlideIndex++;
    showIntroSlides(introSlideIndex);
    setTimeout(autoIntroSlides, 5000); // Change image every 2.5 seconds
  }
  
  //Top Slideshow
  let topSlideIndex = 0;
  
  function showTopSlides(n) {
    let slides = document.querySelectorAll('.slideshow img');
    let dots = document.querySelectorAll('.dots .dot');
    
    if (n >= slides.length) { topSlideIndex = 0 }
    if (n < 0) { topSlideIndex = slides.length - 1 }
    
    slides.forEach((slide) => slide.style.display = "none");
    dots.forEach((dot) => dot.className = dot.className.replace(" active", ""));
    
    slides[topSlideIndex].style.display = "block";
    dots[topSlideIndex].className += " active";
  }
  
  function currentTopSlide(n) {
    topSlideIndex = n;
    showTopSlides(topSlideIndex);
  }
  
  function autoTopSlides() {
    topSlideIndex++;
    showTopSlides(topSlideIndex);
    setTimeout(autoTopSlides, 5000); // Change image every 1.5 seconds
  }
  
  // Initial display
  showIntroSlides(introSlideIndex);
  autoIntroSlides();
  
  showTopSlides(topSlideIndex);
  autoTopSlides();
  </script>
