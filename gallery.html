        <p class="eyebrow">Field archive</p>
        <h1>Gallery</h1>
      </header>

      <div class="gallery-filters" id="galleryFilters" role="group" aria-label="Filter by year" hidden></div>

      <div id="galleryMount">
        <noscript>
          <p class="gallery-fallback">The gallery needs JavaScript to load. Enable it to browse the archive.</p>
        </noscript>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span class="site-footer__copy">&copy; 2026, RAT PMC</span>
        <ul class="site-footer__social">
          <li><a href="https://www.instagram.com/rat.pmc/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
      <p class="lightbox__counter" id="lightboxCounter" aria-hidden="true"></p>
      <button class="lightbox__close" type="button" aria-label="Close viewer" data-lb="close">&times;</button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photo" data-lb="prev">&#8249;</button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightboxImg" alt="">
        <figcaption class="lightbox__cap" id="lightboxCap" hidden></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photo" data-lb="next">&#8250;</button>
      <p class="visually-hidden" id="lightboxStatus" aria-live="polite"></p>
    </div>

    <!--
      GALLERY DATA — add / remove / caption images by editing this list.
      Each entry: { "src": "imgs/2026/FILE.jpg", "year": 2026 }
      Source files live in imgs/<year>/ matching their "year".
      Optional fields:
        "caption"  short title shown under the tile and in the viewer
        "location" e.g. "Quarry AO"        "unit" e.g. "Bravo Detachment"
        "featured" true  -> wider (2-column) tile
        "position" CSS object-position, e.g. "center 20%", to nudge the crop
        "alt"      accessibility description (defaults to caption / generic)
      Newest year is shown first automatically.
    -->
    <script type="application/json" id="galleryData">
